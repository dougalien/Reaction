# The Windows exe is no longer built or published here: the apps are hosted on Streamlit and are not
# for download. This job removes the old public "Latest Windows build" release, its tag, and the exe
# files kept from earlier runs. It runs once when this file reaches main, and can be run again by hand.
name: Remove public downloads

on:
  push:
    branches: [main]
    paths: [".github/workflows/windows-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release, its tag and old build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete windows-latest --repo "$REPO" --yes --cleanup-tag || echo "No release left"
          for id in $(gh api "repos/$REPO/actions/artifacts" --paginate -q '.artifacts[].id'); do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "Deleted artifact $id"
          done
